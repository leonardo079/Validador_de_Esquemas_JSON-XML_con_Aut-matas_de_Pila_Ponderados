[package]
name = "atlas"
description = "F7.2: casos de prueba en MongoDB Atlas (modelo de documento, carga y conexión)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Driver oficial con sus features por defecto: TLS con rustls (sin OpenSSL) y
# resolución de `mongodb+srv` (Atlas).
[dependencies]
baseline.workspace = true
# Sin las features por defecto: `compat-3-0-0` trae bson 2, que activa
# `serde_json/preserve_order` en todo el workspace (rompe D49). bson 3 no.
mongodb = { version = "3.10.2", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }



[[bin]]
name = "cargar-casos"
path = "src/main.rs"

[lints]
workspace = true
