[package]
name = "xsd"
description = "Frontal XSD: lector XML de esquemas con espacios de nombres, parser LL(1) del subconjunto XSD al AST, análisis (tabla de símbolos y restricciones) y bajada a la IR"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# D21: el frontal XSD depende solo de `lexer` e `ir`; no de `semantic` ni de
# `schema-parser` (ningún frontal depende del otro, D13). `ir` llega con la
# bajada de la tarea 5.3.
[dependencies]
lexer.workspace = true
ir.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
