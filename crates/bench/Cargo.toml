[package]
name = "bench"
description = "Fase 6: instrumentación y línea base DOM + validador genérico"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
schema-parser.workspace = true
semantic.workspace = true
xsd.workspace = true
ir.workspace = true
automaton.workspace = true
runtime-rs.workspace = true
baseline.workspace = true
# Solo el binario `metricas` lo usa como asignador global (F6.5): cuenta
# asignaciones, bytes y el pico sin `unsafe` en este crate (D52).
dhat = "=0.3.3"

[dev-dependencies]
# Sin `plotters` ni `rayon`: solo el arnés de `cargo bench` (F6.6, D1).
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }

# F6.6: detector de una regresión cuadrática en las claves repetidas del parser
# de esquemas (sustituye a la prueba ignorada `muchas_claves_en_tiempo_lineal`,
# D1, hallazgo 2). `cargo bench -p bench --bench parser_claves`.
[[bench]]
name = "parser_claves"
harness = false

# F6.5: arnés de métricas DPDA frente a línea base sobre el corpus y el
# bombeo. `cargo run -p bench --release --bin metricas`.
[[bin]]
name = "metricas"
path = "src/bin/metricas.rs"

[lints]
workspace = true

# F5.4: genera payloads válidos desde la IR (con semilla) y los escribe al
# corpus. `cargo run -p bench --release --bin generar -- --escribir`.
[[bin]]
name = "generar"
path = "src/bin/generar.rs"
