[workspace]
resolver = "2"
members = [
    "crates/lexer",
    "crates/schema-parser",
    "crates/semantic",
    "crates/ir",
    "crates/automaton",
    "crates/codegen",
    "crates/runtime-rs",
    "crates/bench",
    "crates/cli",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Leonardo Mariño"]
repository = "https://github.com/leonardo079/Validador_de_Esquemas_JSON-XML_con_Aut-matas_de_Pila_Ponderados"

[workspace.dependencies]
lexer = { path = "crates/lexer" }
schema-parser = { path = "crates/schema-parser" }
semantic = { path = "crates/semantic" }
ir = { path = "crates/ir" }
automaton = { path = "crates/automaton" }
codegen = { path = "crates/codegen" }
runtime-rs = { path = "crates/runtime-rs" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Ningún perfil usa `panic = "abort"`: el servidor (Fase 7) y `schemac` aíslan
# cada compilación de esquema en un hilo y convierten un pánico en un error de
# esa petición con `join()`; con `abort` el pánico tumbaría el proceso
# (`docs/fase3/pendientes.md` §2).
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
